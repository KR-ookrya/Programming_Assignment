<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손글씨 인식기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .api-key-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    .api-key-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .api-key-row input:focus { border-color: #4f8ef7; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      width: 100%;
      max-width: 700px;
    }

    .canvas-wrapper {
      position: relative;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      cursor: crosshair;
      background: #fff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 320px;
      touch-action: none;
    }

    .canvas-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #bbb;
      font-size: 1rem;
      pointer-events: none;
      user-select: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #4f8ef7;
      color: #fff;
    }

    .btn-primary:hover { background: #3a7de8; }
    .btn-primary:disabled { background: #a0bffa; cursor: not-allowed; }

    .btn-clear {
      background: #f0f2f5;
      color: #444;
    }

    .btn-clear:hover { background: #e2e5ea; }

    .color-group {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-btn:hover, .color-btn.active {
      border-color: #4f8ef7;
      transform: scale(1.15);
    }

    .size-slider {
      width: 80px;
      accent-color: #4f8ef7;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: #f8faff;
      border: 1px solid #dce8ff;
      border-radius: 10px;
      min-height: 60px;
      font-size: 1.1rem;
      color: #1a1a2e;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .result-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #e53e3e; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>

<h1>✍️ 손글씨 인식기</h1>
<p class="subtitle">Canvas에 손글씨를 쓰고 인식 버튼을 누르세요</p>

<div class="api-key-row">
  <input type="password" id="apiKey" placeholder="Anthropic API Key (sk-ant-...)" />
</div>

<div class="card">
  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
    <span class="canvas-placeholder" id="placeholder">여기에 글씨를 쓰세요</span>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="recognizeBtn" onclick="recognize()">
      인식하기
    </button>
    <button class="btn btn-clear" onclick="clearCanvas()">지우기</button>

    <div class="color-group">
      <span style="font-size:0.8rem;color:#888;">색상</span>
      <div class="color-btn active" style="background:#1a1a2e;" data-color="#1a1a2e" onclick="setColor(this)"></div>
      <div class="color-btn" style="background:#e53e3e;" data-color="#e53e3e" onclick="setColor(this)"></div>
      <div class="color-btn" style="background:#2b6cb0;" data-color="#2b6cb0" onclick="setColor(this)"></div>
      <span style="font-size:0.8rem;color:#888;margin-left:8px;">굵기</span>
      <input type="range" class="size-slider" id="brushSize" min="2" max="20" value="4">
    </div>
  </div>

  <div id="error" class="error"></div>

  <div style="margin-top:20px;">
    <div class="result-label">인식 결과</div>
    <div class="result-box" id="result">—</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');

  let drawing = false;
  let hasDrawn = false;
  let color = '#1a1a2e';

  // 캔버스 실제 해상도 설정
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: src.clientX - rect.left,
      y: src.clientY - rect.top
    };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

    if (!hasDrawn) {
      hasDrawn = true;
      placeholder.style.display = 'none';
    }
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.strokeStyle = color;
    ctx.lineWidth = document.getElementById('brushSize').value;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDraw() { drawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stopDraw);

  function clearCanvas() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    hasDrawn = false;
    placeholder.style.display = '';
    document.getElementById('result').textContent = '—';
    document.getElementById('error').textContent = '';
  }

  function setColor(el) {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    color = el.dataset.color;
  }

  async function recognize() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const btn = document.getElementById('recognizeBtn');

    errorEl.textContent = '';

    if (!apiKey) {
      errorEl.textContent = 'API Key를 입력해 주세요.';
      return;
    }
    if (!hasDrawn) {
      errorEl.textContent = '먼저 글씨를 써 주세요.';
      return;
    }

    // 흰 배경 위에 그림을 합성해서 PNG로 내보내기
    const offscreen = document.createElement('canvas');
    offscreen.width = canvas.width;
    offscreen.height = canvas.height;
    const oc = offscreen.getContext('2d');
    oc.fillStyle = '#ffffff';
    oc.fillRect(0, 0, offscreen.width, offscreen.height);
    oc.drawImage(canvas, 0, 0);
    const imageData = offscreen.toDataURL('image/png').split(',')[1];

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>인식 중...';
    resultEl.textContent = '분석 중입니다...';

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-6',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: {
                  type: 'base64',
                  media_type: 'image/png',
                  data: imageData
                }
              },
              {
                type: 'text',
                text: '이 이미지에 손으로 쓴 글씨가 있습니다. 손글씨를 정확히 인식하여 텍스트로 변환해 주세요. 인식된 텍스트만 출력하고 다른 설명은 하지 마세요. 글씨가 없으면 "(글씨 없음)"이라고 답하세요.'
              }
            ]
          }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      resultEl.textContent = data.content[0].text;
    } catch (e) {
      errorEl.textContent = '오류: ' + e.message;
      resultEl.textContent = '—';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '인식하기';
    }
  }
</script>
</body>
</html>
