<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클릭 게임</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
    }

    h1 {
      margin-top: 30px;
    }

    #score {
      font-size: 24px;
      margin: 10px 0;
    }

    #gameBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #ff6b6b;
      border: none;
      font-size: 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }

    #gameBtn:active {
      transform: scale(0.9);
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🎮 클릭 게임</h1>
<p>버튼을 최대한 많이 클릭하세요!</p>

<div id="score">점수: 0</div>
<div id="timer">남은 시간: 10초</div>

<button id="gameBtn" onclick="addScore()">클릭!</button>
<br>
<button onclick="startGame()">게임 시작</button>

<script>
  let score = 0;
  let time = 10;
  let timerInterval;

  function startGame() {
    score = 0;
    time = 10;
    document.getElementById('score').innerText = '점수: ' + score;
    document.getElementById('timer').innerText = '남은 시간: ' + time + '초';

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      time--;
      document.getElementById('timer').innerText = '남은 시간: ' + time + '초';

      if (time <= 0) {
        clearInterval(timerInterval);
        alert('게임 종료! 점수: ' + score);
      }
    }, 1000);
  }

  function addScore() {
    if (time > 0) {
      score++;
      document.getElementById('score').innerText = '점수: ' + score;
    }
  }
</script>

</body>
</html>
