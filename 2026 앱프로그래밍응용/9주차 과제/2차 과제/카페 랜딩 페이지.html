<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 랜딩 페이지</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #fafafa;
    }

    header {
      background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') no-repeat center/cover;
      height: 300px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
    }

    header h1 {
      font-size: 40px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .item {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 200px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .item h3 {
      margin: 10px 0;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

<header>
  <h1>☕ My Cafe</h1>
  <p>감성 카페 랜딩 페이지</p>
</header>

<section class="section">
  <h2>추천 메뉴</h2>
  <div class="menu">
    <div class="item">
      <h3>아메리카노</h3>
      <p>₩3,500</p>
    </div>
    <div class="item">
      <h3>카페라떼</h3>
      <p>₩4,000</p>
    </div>
    <div class="item">
      <h3>티라미수</h3>
      <p>₩5,500</p>
    </div>
  </div>
  <button onclick="order()">주문하기</button>
</section>

<footer>
  <p>© 2026 My Cafe</p>
</footer>

<script>
  function order() {
    alert('주문이 접수되었습니다! 😊');
  }
</script>

</body>
</html>
